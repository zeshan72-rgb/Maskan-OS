<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RentOS — Interactive Demo</title>
<style>
:root{
  --bg:#fafafa; --surface:#fff; --border:#e5e5e5; --border-soft:#f0f0f0;
  --text:#171717; --text-2:#525252; --text-3:#a3a3a3;
  --accent:#171717; --success:#059669; --warn:#d97706; --danger:#dc2626; --info:#0284c7;
  --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- motion ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{width:0}}
.anim-up{animation:slideUp .34s cubic-bezier(.22,1,.36,1) both}
.anim-down{animation:slideDown .22s cubic-bezier(.22,1,.36,1) both}
.anim-in{animation:fadeIn .3s ease-out both}
.stagger>*{animation:slideUp .34s cubic-bezier(.22,1,.36,1) both}
.stagger>*:nth-child(1){animation-delay:0ms}.stagger>*:nth-child(2){animation-delay:35ms}
.stagger>*:nth-child(3){animation-delay:70ms}.stagger>*:nth-child(4){animation-delay:105ms}
.stagger>*:nth-child(5){animation-delay:140ms}.stagger>*:nth-child(6){animation-delay:175ms}
.stagger>*:nth-child(7){animation-delay:210ms}.stagger>*:nth-child(8){animation-delay:245ms}
.stagger>*:nth-child(n+9){animation-delay:280ms}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:232px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar.dark{background:#171717;border-right-color:#262626}
.brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--border)}
.sidebar.dark .brand{border-bottom-color:#262626}
.logo{width:28px;height:28px;border-radius:7px;background:#171717;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.sidebar.dark .logo{background:#fff;color:#171717}
.brand-name{font-weight:600;font-size:14px}
.sidebar.dark .brand-name{color:#fff}
.brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#737373}
.orgpick{margin:12px 12px 0;padding:8px 10px;border:1px solid var(--border);border-radius:9px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s}
.orgpick:hover{background:#fafafa}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-2);transition:background .15s,color .15s;margin-bottom:2px}
.nav a:hover{background:#f5f5f5;color:var(--text)}
.nav a.on{background:#f5f5f5;color:var(--text)}
.sidebar.dark .nav a{color:#a3a3a3}
.sidebar.dark .nav a:hover{background:#262626;color:#fff}
.sidebar.dark .nav a.on{background:#262626;color:#fff}
.nav svg{width:16px;height:16px;flex-shrink:0}
.sidefoot{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)}
.sidebar.dark .sidefoot{border-top-color:#262626}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px}
.search{display:flex;align-items:center;gap:8px;height:36px;flex:1;max-width:420px;border:1px solid var(--border);border-radius:9px;padding:0 12px;color:var(--text-3);font-size:13.5px;transition:border-color .15s}
.search:hover{border-color:#d4d4d4}
kbd{border:1px solid var(--border);background:#fafafa;border-radius:4px;padding:1px 5px;font-size:10px;font-family:var(--font);color:var(--text-3)}
.avatar{width:32px;height:32px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.content{flex:1;overflow-y:auto;padding:28px 32px 60px}
.wrap{max-width:1320px;margin:0 auto}

/* ---------- components ---------- */
.crumbs{display:flex;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:8px}
.crumbs span:not(:last-child)::after{content:"›";margin-left:6px;color:#d4d4d4}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:13.5px;margin-top:3px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sechead{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:26px 0 12px}
.sechead:first-child{margin-top:0}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr!important}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-h{padding:18px 18px 10px}
.card-t{font-size:13.5px;font-weight:600}
.card-d{font-size:12.5px;color:var(--text-3);margin-top:2px}
.card-b{padding:0 18px 18px}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.stat-l{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);display:flex;justify-content:space-between;align-items:center}
.stat-v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
.stat-s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.bar{height:4px;background:#f0f0f0;border-radius:99px;overflow:hidden;margin-top:11px}
.bar>i{display:block;height:100%;border-radius:99px;animation:grow .9s cubic-bezier(.22,1,.36,1) both}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tablewrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
thead{background:#fafafa}
th{text-align:left;padding:9px 14px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border-soft);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:#fafafa}
.num{text-align:right;font-variant-numeric:tabular-nums}
.link{font-weight:500;cursor:pointer;transition:color .15s}
.link:hover{color:var(--text-2);text-decoration:underline}
.muted{color:var(--text-3)}
.mini{font-size:11.5px;color:var(--text-3);margin-top:1px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:500;border:1px solid;white-space:nowrap}
.p-neutral{background:#fafafa;border-color:var(--border);color:var(--text-2)}
.p-success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.p-warn{background:#fffbeb;border-color:#fde68a;color:#b45309}
.p-danger{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.p-info{background:#f0f9ff;border-color:#bae6fd;color:#0369a1}
.p-outline{background:#fff;border-color:#d4d4d4;color:var(--text-2)}

.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:9px;font-size:13.5px;font-weight:500;background:#171717;color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:#333}.btn:active{transform:scale(.98)}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px}
.btn.out{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn.out:hover{background:#fafafa}
.btn.ghost{background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:#f5f5f5;color:var(--text)}
.btn svg{width:15px;height:15px}

.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 13px;border-radius:9px;font-size:13.5px;border:1px solid;transition:transform .18s,box-shadow .18s;cursor:pointer}
.alert:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.a-danger{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.a-warn{background:#fffbeb;border-color:#fde68a;color:#92400e}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:9px 13px;font-size:13.5px;font-weight:500;color:var(--text-3);position:relative;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:#171717;border-radius:2px}

.dl{font-size:13.5px}
.dl>div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--border-soft)}
.dl>div:first-child{border-top:none}
.dl dt{color:var(--text-3)}
.dl dd{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}

.timeline{position:relative;padding-left:20px;border-left:1px solid var(--border)}
.timeline li{list-style:none;margin-bottom:16px;position:relative}
.timeline li::before{content:"";position:absolute;left:-25px;top:6px;width:9px;height:9px;border-radius:50%;background:#a3a3a3;border:2px solid #fff}
.timeline .t-t{font-size:13.5px;font-weight:500;text-transform:capitalize}
.timeline .t-d{font-size:11.5px;color:var(--text-3)}

.empty{border:1px dashed #d4d4d4;background:#fafafa;border-radius:var(--radius);padding:52px 20px;text-align:center}
.empty .ic{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 12px;color:var(--text-3)}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.inp{height:36px;border:1px solid var(--border);border-radius:9px;padding:0 12px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text)}
.inp::placeholder{color:var(--text-3)}
select.inp{cursor:pointer}

/* portal shell */
.portal{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.pbar{height:56px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.pbar-in{max-width:920px;margin:0 auto;height:100%;display:flex;align-items:center;gap:12px;padding:0 18px}
.pnav{display:flex;gap:2px;margin-left:auto}
.pnav a{padding:6px 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-2);transition:background .15s}
.pnav a.on{background:#f5f5f5;color:var(--text)}
.pmain{max-width:920px;margin:0 auto;width:100%;padding:22px 18px 40px}
@media(max-width:640px){.pnav{display:none}.pmain{padding-bottom:86px}}
.pbottom{display:none}
@media(max-width:640px){
  .pbottom{display:flex;position:fixed;inset:auto 0 0 0;background:rgba(255,255,255,.97);border-top:1px solid var(--border);z-index:30}
  .pbottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;font-size:10px;font-weight:500;color:var(--text-3)}
  .pbottom a.on{color:var(--text)}
  .pbottom svg{width:19px;height:19px}
  .sidebar{display:none}
  .content{padding:20px 16px 40px}
  .topbar{padding:0 16px}
}

.switcher{position:fixed;right:18px;bottom:18px;z-index:60;background:#171717;color:#fff;border-radius:12px;padding:9px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;gap:5px;flex-wrap:wrap;max-width:min(560px,92vw)}
.switcher b{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#a3a3a3;width:100%;padding:2px 6px 4px}
.switcher a{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:500;color:#d4d4d4;transition:background .15s}
.switcher a:hover{background:#333;color:#fff}
.switcher a.on{background:#fff;color:#171717}

.banner{background:#171717;color:#fff;padding:7px 16px;font-size:12.5px;text-align:center}
.banner b{font-weight:600}
</style>
</head>

/* ---------- helpers ---------- */
const el = (h) => { const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
const pillFor = s => {
  const m = {
    "Paid":"success","Confirmed":"success","Active":"success","Cleared":"success","Occupied":"success","Completed":"success","Finalised":"success","approved":"success",
    "Partial":"warn","Expiring":"warn","Pending Verification":"warn","Submitted":"info","Due Soon":"warn","Scheduled":"info","In Progress":"warn","Waiting":"warn","Maintenance":"warn","Trial":"info","pending":"warn",
    "Overdue":"danger","Bounced":"danger","Rejected":"danger","Terminated":"danger","Expired":"danger","Emergency":"danger","Suspended":"danger","rejected":"danger",
    "Renewal Offered":"info","Assigned":"info","Draft":"neutral","Upcoming":"neutral","Vacant":"neutral","Received":"neutral","Stored":"neutral","Closed":"outline","High":"warn","Normal":"neutral","Low":"outline",
  };
  return `<span class="pill p-${m[s]||"neutral"}">${s}</span>`;
};
const stat = (label,value,{sub,tone,pct,icon}={}) => {
  const col = {success:"var(--success)",warn:"var(--warn)",danger:"var(--danger)"}[tone]||"var(--text)";
  const bar = {success:"#10b981",warn:"#f59e0b",danger:"#ef4444"}[tone]||"#171717";
  return `<div class="stat">
    <div class="stat-l"><span>${label}</span>${icon?`<span style="width:15px;height:15px;color:#d4d4d4">${icon}</span>`:""}</div>
    <div class="stat-v" style="color:${col}">${value}</div>
    ${sub?`<div class="stat-s">${sub}</div>`:""}
    ${pct!=null?`<div class="bar"><i style="width:${Math.min(100,pct)}%;background:${bar}"></i></div>`:""}
  </div>`;
};
const table = (cols, rows) => `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th${c.r?' class="num"':''}>${c.t}</th>`).join("")}</tr></thead><tbody class="stagger">${rows}</tbody></table></div>`;
const empty = (icon,title,desc,cta) => `<div class="empty"><div class="ic" style="padding:11px">${icon}</div><div style="font-weight:500">${title}</div><div class="sub" style="max-width:380px;margin:4px auto 0">${desc}</div>${cta?`<div style="margin-top:14px">${cta}</div>`:""}</div>`;

/* ---------- charts (inline SVG, no library) ---------- */
function barChart(data){
  const w=560,h=200,pad=30,max=Math.max(...data.map(d=>d.exp))*1.1;
  const bw=(w-pad)/data.length;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px">
    ${[0,.25,.5,.75,1].map(t=>`<line x1="${pad}" x2="${w}" y1="${(h-24)-(h-44)*t}" y2="${(h-24)-(h-44)*t}" stroke="#f1f5f9" stroke-width="1"/>`).join("")}
    ${data.map((d,i)=>{
      const x=pad+i*bw+bw*.16, bwid=bw*.3;
      const he=(d.exp/max)*(h-44), hc=(d.col/max)*(h-44);
      return `<rect x="${x}" y="${h-24-he}" width="${bwid}" height="${he}" rx="3" fill="#d4d4d4">
                <animate attributeName="height" from="0" to="${he}" dur="0.7s" fill="freeze"/>
                <animate attributeName="y" from="${h-24}" to="${h-24-he}" dur="0.7s" fill="freeze"/></rect>
              <rect x="${x+bwid+3}" y="${h-24-hc}" width="${bwid}" height="${hc}" rx="3" fill="#171717">
                <animate attributeName="height" from="0" to="${hc}" dur="0.9s" fill="freeze"/>
                <animate attributeName="y" from="${h-24}" to="${h-24-hc}" dur="0.9s" fill="freeze"/></rect>
              <text x="${x+bwid}" y="${h-8}" font-size="10" fill="#64748b" text-anchor="middle" font-family="var(--font)">${d.m}</text>`;
    }).join("")}
  </svg>
  <div style="display:flex;gap:16px;font-size:11.5px;color:var(--text-3);margin-top:6px">
    <span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#d4d4d4;display:inline-block"></i>Expected</span>
    <span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#171717;display:inline-block"></i>Collected</span>
  </div>`;
}
function hBarChart(data){
  const max=Math.max(...data.map(d=>d.n));
  const shades=["#171717","#334155","#475569","#64748b","#94a3b8"];
  return `<div style="display:flex;flex-direction:column;gap:9px;padding-top:4px">
    ${data.map((d,i)=>`<div style="display:flex;align-items:center;gap:10px">
      <span style="width:112px;font-size:12px;color:var(--text-2);text-align:right;flex-shrink:0">${d.c}</span>
      <div style="flex:1;height:20px;background:#f8fafc;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${(d.n/max)*100}%;background:${shades[i%5]};border-radius:4px;animation:grow .8s cubic-bezier(.22,1,.36,1) both;animation-delay:${i*60}ms"></div>
      </div>

}

const MANAGER_NAV = [
  ["dashboard","Dashboard",I.dash],["properties","Properties",I.build],["owners","Owners",I.user],
  ["tenants","Tenants",I.users],["leases","Leases",I.file],["finance","Finance",I.wallet],
  ["cheques","Cheques",I.bank],["maintenance","Maintenance",I.wrench],["reports","Reports",I.chart],
  ["settings","Settings",I.cog],
];
const ADMIN_NAV = [["admin","Overview",I.dash],["admin-orgs","Organisations",I.build],["admin-plans","Plans",I.card],["admin-audit","Audit",I.act]];
const TENANT_NAV = [["tenant","Home",I.home],["tenant-pay","Payments",I.receipt],["tenant-lease","Lease",I.file],["tenant-maint","Repairs",I.wrench]];
const OWNER_NAV = [["owner","Overview",I.dash],["owner-fin","Financials",I.wallet],["owner-stmt","Statements",I.file]];
const VENDOR_NAV = [["vendor","Jobs",I.brief],["vendor-done","Completed",I.clip]];

const ROUTE_GROUP = r => {
  if(r.startsWith("admin")) return "admin";
  if(r.startsWith("tenant")) return "tenant";
  if(r.startsWith("owner")&&r!=="owners"&&r!=="owner-detail") return "owner";
  if(r.startsWith("vendor")) return "vendor";
  return "manager";
};

function shellManager(route,dark){
  const nav = dark?ADMIN_NAV:MANAGER_NAV;
  const who = dark?["RentOS Platform Admin","RA"]:["Fatima Al-Sulaiti","FA"];
  return `<div class="app">
    <aside class="sidebar${dark?" dark":""}">
      <div class="brand"><div class="logo">R</div><div><div class="brand-name">RentOS</div>${dark?'<div class="brand-sub">Platform admin</div>':''}</div></div>
      ${dark?"":'<div class="orgpick"><span>Pearl Property Management</span><svg style="width:13px;height:13px;color:#a3a3a3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></div>'}
      <nav class="nav">${nav.map(([r,l,ic])=>`<a class="${r===route?"on":""}" onclick="go('${r}')">${ic}${l}</a>`).join("")}</nav>
      <div class="sidefoot">${who[0]}</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="search">${I.search}<span style="flex:1">Search tenants, units, leases…</span><kbd>⌘K</kbd></div>
        <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
          <button class="btn out sm">${I.plus} New lease</button>
          <div style="position:relative;width:32px;height:32px;display:grid;place-items:center;color:var(--text-2)"><span style="width:17px;height:17px">${I.bell}</span>
          <span style="position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;font-size:9px;font-weight:600;border-radius:99px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px">3</span></div>
          <div class="avatar">${who[1]}</div>
        </div>
      </header>
      <div class="content"><div class="wrap" id="view"></div></div>
    </div></div>`;
}

function shellPortal(route,nav,name,initials){
  return `<div class="portal">
    <header class="pbar"><div class="pbar-in">
      <div class="logo">R</div>
      <div style="min-width:0"><div style="font-weight:600;font-size:13.5px">Pearl Property Management</div></div>
      <nav class="pnav">${nav.map(([r,l])=>`<a class="${r===route?"on":""}" onclick="go('${r}')">${l}</a>`).join("")}</nav>
      <div class="avatar" style="width:30px;height:30px">${initials}</div>
    </div></header>
    <main class="pmain" id="view"></main>
    <nav class="pbottom">${nav.map(([r,l,ic])=>`<a class="${r===route?"on":""}" onclick="go('${r}')">${ic}${l}</a>`).join("")}</nav>
  </div>`;
}

function render(){
  const route = location.hash.slice(1) || "dashboard";
  const group = ROUTE_GROUP(route);
  const root = document.getElementById("root");

  if(group==="manager") root.innerHTML = shellManager(route,false);
  else if(group==="admin") root.innerHTML = shellManager(route,true);
  else if(group==="tenant") root.innerHTML = shellPortal(route,TENANT_NAV,"John Smith","JS");
  else if(group==="owner") root.innerHTML = shellPortal(route,OWNER_NAV,"Jassim Al-Thani","JA");
  else root.innerHTML = shellPortal(route,VENDOR_NAV,"Rashid Cooling","RC");

  const view = document.getElementById("view");
  view.innerHTML = (V[route]||V.dashboard)();
  view.scrollTop = 0;
  const c = document.querySelector(".content"); if(c) c.scrollTop = 0;
  renderSwitcher(route);
}

function renderSwitcher(route){
  const g = ROUTE_GROUP(route);
  document.getElementById("switcher").innerHTML =
    `<b>Switch portal — this is what each role sees</b>` +
    [["dashboard","Manager","manager"],["tenant","Tenant","tenant"],["owner","Owner","owner"],
     ["vendor","Vendor","vendor"],["admin","Platform admin","admin"]]
    .map(([r,l,gg])=>`<a class="${g===gg?"on":""}" onclick="go('${r}')">${l}</a>`).join("");
}

window.go = r => { location.hash = r; };
window.addEventListener("hashchange", render);
render();
</script>
